global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Demo metrics so Grafana has something to graph before real targets exist.
  - job_name: demo
    static_configs:
      - targets: ["demo.promlabs.com:10000"]
