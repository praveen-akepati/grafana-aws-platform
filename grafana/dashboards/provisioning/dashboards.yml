# Grafana file provisioning — dashboards from Git (see docs/grafana-gitops.md)
apiVersion: 1

providers:
  - name: git-dashboards
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # UI edits allowed; export to Git weekly — see docs/grafana-gitops.md
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
